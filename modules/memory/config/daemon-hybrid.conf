[Elastic_Thresholds]
vram_high_watermark_percent = 85
vram_low_watermark_percent = 60
fast_vram_buffer_mb = 1024
fallback_buffer_mb = 64
gpu_min_block_bytes = 4194304

[IO_Priority_Mapping]
critical_read = fast_vram
normal_read = zswap
critical_write = zswap
normal_write = zswap
background_write = nvme_background

[Fallback]
gpu_unavailable = cpu_then_zswap
vram_pressure = zswap
game_mode = protect_foreground_vram

[Safety]
policy_only = true
write_kernel_sysfs = false
modify_active_swap = false
