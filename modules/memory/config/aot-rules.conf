[AOT_Indexer]
enabled = true
mode = metadata_and_content_index_only
hash_algorithm = SHA-256
content_uuid = UUIDv5_from_SHA256
scan_elf_magic = true
scan_opcodes = false
rewrite_elf = false
inject_vram_hooks = false
deduplicate_binary_instructions = false

[Exclusions]
skip_symlinks = true
skip_system_loader = true
skip_libc = true
skip_systemd = true
