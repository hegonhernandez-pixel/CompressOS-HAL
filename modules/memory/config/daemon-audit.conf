[Audit_Engine]
enabled = true
mode = background_low_priority
scan_interval_seconds = 300
integrity_algorithm = SHA-256
max_blocks_per_cycle = 64
verify_before_serve = true

[Storage]
cas_root = /var/lib/compresso/cas

[On_Corruption]
action = quarantine_and_cpu_fallback
preserve_quarantined_blob = true
never_return_unverified_blob = true

[Safety]
source_files_are_immutable = true
rewrite_system_binaries = false
