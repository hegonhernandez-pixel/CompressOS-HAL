[Boot_Index]
stage0 = kernel_and_initramfs
stage1 = rootfs_mounted
early_vulkan = optional_after_rootfs
default_fallback = cpu

[Early_Memory]
zram_owner = compresso-memoryd
zswap_owner = kernel
vram_buffer_allocation = deferred_until_vulkan_device_ready

[Safety]
do_not_create_kernel_zone = true
do_not_map_rootfs_into_vram = true
do_not_require_gpu_for_boot = true
